name: Build 26.1.2 JAR

on:
  push:
    branches:
      - "26.1.2"
  pull_request:
    branches:
      - "26.1.2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Meteor addon for Minecraft 26.1.2
        run: ./gradlew clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: InventoryMoveBypass-26.1.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
